<mat-form-field appearance="fill" style="width: 100%" class="num-margin-b-40">
  <mat-label id="select-templates-label">{{ 'SELECT_EHR_TEMPLATE' | translate }}</mat-label>
  <mat-select
    aria-labelledby="select-templates-label"
    [formControl]="selectedTemplates"
    multiple
    data-test="aqb__templates-selection"
  >
    @for (template of templates; track template) {
      <mat-option [value]="template" [attr.data-test]="'aqb__templates-selection__' + template">
        {{ template }}
      </mat-option>
    }
  </mat-select>
</mat-form-field>

<mat-accordion
  class="num-accordion num-accordion-small"
  [@.disabled]="!isViewRendered"
  [multi]="false"
>
  @for (templateId of selectedTemplates.value; track templateId) {
    <num-aql-builder-template-tree
      [templateId]="templateId"
      [selectDestination]="selectDestination"
      [mode]="mode"
      (selectedItem)="selectedItem.emit($event)"
    ></num-aql-builder-template-tree>
  }
</mat-accordion>
